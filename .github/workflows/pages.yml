name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - name: Verify compiled site before publishing
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -f dist/game-art/title_bg-optimized.webp
          test -f dist/story/story_ch01-optimized.webp
          if grep -q '/src/main.ts' dist/index.html; then
            echo 'ERROR: dist/index.html still references development TypeScript.'
            exit 1
          fi
          if ! grep -Eq 'assets/[^" ]+\.(js|css)' dist/index.html; then
            echo 'ERROR: built CSS/JS references were not found in dist/index.html.'
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
